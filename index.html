<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#10151f">
<title>Semana de entrenamiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // Se activa antes de pintar para evitar un parpadeo: ?modo=fondo
  if (new URLSearchParams(location.search).get('modo') === 'fondo') {
    document.documentElement.classList.add('fondo');
  }
</script>
<style>
/* =====================================================================
   AJUSTES DEL MODO FONDO (Lively Wallpaper)  ->  editá estos valores
   ===================================================================== */
:root {
  --fondo-color: #0c1017;     /* color liso del fondo en modo fondo */
  --panel-ancho: 27rem;       /* ancho del panel (se escala con la pantalla) */
  --panel-derecha: calc(var(--notas-derecha) + var(--notas-ancho) + 2vw); /* queda a la izquierda de las notas */
  --panel-vertical: 50%;      /* 50% = centrado; 40% lo sube, 60% lo baja */
  --panel-alto-max: 92vh;     /* alto máximo del panel */
  --panel-opacidad: 0.78;     /* 0 = transparente, 1 = sólido */
  --panel-blur: 12px;         /* desenfoque detrás del panel */
  --escala: 1;                /* tamaño general: 0.8 más chico, 1.2 más grande */

  /* Columna izquierda: fechas importantes */
  --fechas-ancho: 12.5rem;
  --fechas-izquierda: 7vw;    /* 7vw esquiva los íconos del escritorio; bajalo a 2vw para pegarlo al borde */
  /* Columna derecha: notitas */
  --notas-ancho: 13rem;
  --notas-derecha: 2.5vw;
}

/* ===== Paleta ===== */
:root {
  --bg: #10151f;
  --panel-rgb: 21 27 38;
  --superficie: #1c2433;
  --borde: #2b3548;
  --texto: #e9eef7;
  --suave: #8f9bb2;
  --peligro: #f0716b;

  /* Tipografías */
  --fuente-titulo: 'Barlow Condensed', 'Arial Narrow', 'Segoe UI', sans-serif;
  --fuente-texto: 'Barlow', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
}

* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--texto);
  font-family: var(--fuente-texto);
  line-height: 1.35;
  min-height: 100dvh;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--texto); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ===== Modo normal (celular) ===== */
.panel { position: relative; max-width: 30rem; margin: 0 auto; }
.contenido { padding: calc(1.4rem + env(safe-area-inset-top, 0px)) 1rem calc(2.5rem + env(safe-area-inset-bottom, 0px)); }

/* ===== Modo fondo ===== */
html.fondo { font-size: clamp(11px, calc(1.3vmin * var(--escala)), 40px); }
html.fondo body { background: var(--fondo-color); overflow: hidden; height: 100vh; min-height: 0; }
html.fondo .panel {
  position: fixed;
  right: var(--panel-derecha);
  top: var(--panel-vertical);
  transform: translateY(-50%);
  width: var(--panel-ancho);
  max-width: none;
  min-height: 0;
  max-height: var(--panel-alto-max);
  margin: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 1.25rem;
  background: rgb(var(--panel-rgb) / var(--panel-opacidad));
  -webkit-backdrop-filter: blur(var(--panel-blur));
  backdrop-filter: blur(var(--panel-blur));
  border: 1px solid rgb(255 255 255 / 0.07);
}
html.fondo .contenido { padding: 1.1rem 1.1rem 1rem; overflow-y: auto; }
html.fondo .contenido::-webkit-scrollbar { width: 0; }

/* ===== Encabezado ===== */
.encabezado { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; }
h1, .sheet-card h2, .dia-nombre, .seccion-titulo, .chip, .contador { font-family: var(--fuente-titulo); }
h1 { margin: 0; font-size: 2rem; font-weight: 700; letter-spacing: 0; line-height: 1.1; }
.rango { margin: 0.15rem 0 0; font-size: 0.85rem; color: var(--suave); }
.contador { font-size: 2.3rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.contador small { font-size: 1rem; font-weight: 500; color: var(--suave); }

.segmentos { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.25rem; margin-top: 0.9rem; }
.seg { height: 0.45rem; border-radius: 99px; background: var(--superficie); transition: background 0.3s; }
.seg.on { background: rgb(var(--rgb)); }

/* ===== Secciones ===== */
.seccion-titulo { display: flex; align-items: baseline; gap: 0.4rem; margin: 1.5rem 0 0.6rem; font-size: 1.1rem; font-weight: 700; color: var(--texto); }
.seccion-titulo span { font-weight: 500; font-variant-numeric: tabular-nums; }
.completa { margin: 0; font-size: 0.9rem; color: var(--suave); }

/* ===== Chips ===== */
.chip {
  --rgb: 143 155 178;
  display: inline-flex; align-items: center; gap: 0.45rem;
  padding: 0.5rem 0.8rem;
  border-radius: 999px;
  border: 1px solid rgb(var(--rgb) / 0.6);
  background: rgb(var(--rgb) / 0.08);
  font-size: 1.1rem;
  font-weight: 600;
  letter-spacing: 0.01em;
}
.chip .punto { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: rgb(var(--rgb)); flex: none; }
.chip svg { width: 0.85rem; height: 0.85rem; flex: none; }
.chip.hecha { background: rgb(var(--rgb)); border-color: rgb(var(--rgb)); color: #0e131b; font-weight: 700; }
.chip.hecha .quitar { opacity: 0.55; margin-left: 0.1rem; }

/* ===== Tarjetas de sesión (con subtítulo) ===== */
.tarjeta {
  --rgb: 143 155 178;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 0.1rem;
  width: 100%; min-height: 3.5rem; text-align: left;
  padding: 0.55rem 0.85rem;
  border-radius: 0.8rem;
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-left: 0.3rem solid rgb(var(--rgb));
}
.t-nombre { font-family: var(--fuente-titulo); font-size: 1.2rem; font-weight: 700; line-height: 1.1; color: var(--texto); }
.t-sub { font-size: 0.8rem; line-height: 1.25; color: var(--suave); }
.tarjeta.lleno { background: rgb(var(--rgb)); border-color: rgb(var(--rgb)); }
.tarjeta.lleno .t-nombre { color: #0e131b; }
.tarjeta.lleno .t-sub { color: rgb(14 19 27 / 0.78); }
.tarjeta.vacia {
  flex-direction: row; align-items: center; justify-content: flex-start; gap: 0.5rem;
  background: transparent; border: 1px dashed var(--borde);
  color: var(--suave); font-size: 0.85rem;
}
.tarjeta.vacia svg { width: 1rem; height: 1rem; flex: none; }
.tarjeta.libre { opacity: 0.45; }

/* ===== Días ===== */
.faltan { display: grid; gap: 0.5rem; }
.dias { display: grid; gap: 0.5rem; }
.dia { display: grid; grid-template-columns: 3.1rem 1fr; gap: 0.6rem; align-items: center; }
.dia-cab { line-height: 1.1; }
.dia-nombre { font-size: 1.2rem; font-weight: 700; }
.dia-fecha { font-size: 0.75rem; color: var(--suave); }
.dia.hoy .dia-nombre, .dia.hoy .dia-fecha { color: #5cc8f2; }
.dia.hoy .dia-fecha { font-weight: 600; }

/* ===== Columnas laterales: fechas (izq) y notas (der) ===== */
.lateral { max-width: 30rem; margin: 0 auto; padding: 0 1rem; display: flex; flex-direction: column; }
.lateral.der { padding-bottom: calc(2.5rem + env(safe-area-inset-bottom, 0px)); }
.fechas, .notas { display: grid; gap: 0.6rem; }

.cuenta {
  --rgb: 143 155 178;
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.6rem 0.85rem;
  border-radius: 0.9rem;
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-left: 0.3rem solid rgb(var(--rgb));
}
.cuenta-num { font-family: var(--fuente-titulo); font-size: 2.1rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; min-width: 2.2rem; text-align: center; }
.cuenta-info { display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
.cuenta-nombre { font-family: var(--fuente-titulo); font-size: 1.1rem; font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
.cuenta-resto { font-size: 0.75rem; color: var(--suave); line-height: 1.2; }
.cuenta.vacia .cuenta-num { color: var(--suave); }

.nota {
  --rgb: 245 208 120;
  border-radius: 0.8rem;
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-top: 0.25rem solid rgb(var(--rgb));
  overflow: hidden;
}
.nota:focus-within { border-color: rgb(var(--rgb)); }
.nota textarea {
  display: block; width: 100%; min-height: 4.2rem; max-height: 10rem; resize: none;
  padding: 0.55rem 0.75rem; border: 0; background: transparent; color: var(--texto);
  font: inherit; font-size: 1rem; line-height: 1.35;
  field-sizing: content;
}
.nota textarea::placeholder { color: var(--suave); opacity: 0.7; }
.nota textarea:focus-visible { outline: none; }

html.fondo .lateral {
  position: fixed; top: var(--panel-vertical); transform: translateY(-50%);
  max-width: none; margin: 0; padding: 0;
}
html.fondo .lateral.izq { left: var(--fechas-izquierda); width: var(--fechas-ancho); }
html.fondo .lateral.der { right: var(--notas-derecha); width: var(--notas-ancho); }
html.fondo .lateral .seccion-titulo { display: none; }
html.fondo .fechas, html.fondo .notas { gap: 0.7rem; }
html.fondo .cuenta, html.fondo .nota {
  background: rgb(var(--panel-rgb) / var(--panel-opacidad));
  -webkit-backdrop-filter: blur(var(--panel-blur));
  backdrop-filter: blur(var(--panel-blur));
  border-color: rgb(255 255 255 / 0.07);
}
html.fondo .cuenta { border-left-color: rgb(var(--rgb)); }
html.fondo .nota { border-top-color: rgb(var(--rgb)); }
html.fondo .nota textarea { font-size: 0.9rem; }

/* ===== Pie ===== */
.pie { display: flex; align-items: center; flex-wrap: wrap; gap: 0.6rem 0.9rem; margin-top: 1.5rem; }
.btn-sec {
  padding: 0.55rem 0.9rem; border-radius: 0.7rem;
  background: transparent; border: 1px solid var(--borde); font-size: 0.85rem;
}
.btn-sec.peligro { border-color: var(--peligro); color: var(--peligro); }
.btn-principal {
  padding: 0.7rem 1.1rem; border-radius: 0.8rem; border: 0;
  background: #5cc8f2; color: #0e131b; font-weight: 650; font-size: 0.95rem;
}
.link { background: none; border: 0; padding: 0.3rem 0; color: var(--suave); font-size: 0.85rem; text-decoration: underline; text-underline-offset: 3px; }
.aviso-error { margin: 0.9rem 0 0; padding: 0.7rem 0.8rem; border-radius: 0.7rem; background: rgb(240 113 107 / 0.12); border: 1px solid rgb(240 113 107 / 0.5); font-size: 0.85rem; line-height: 1.4; }
.estado { margin-left: auto; display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; color: var(--suave); }
.estado i { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--suave); }
.estado[data-e="ok"] i { background: #4fd1a5; }
.estado[data-e="pendiente"] i, .estado[data-e="conectando"] i, .estado[data-e="offline"] i { background: #f5a85a; }
.estado[data-e="error"] i { background: var(--peligro); }

/* ===== Pantalla de código ===== */
#vistaCodigo p.ayuda { color: var(--suave); font-size: 0.9rem; margin: 0.6rem 0 1.2rem; }
#inputCodigo {
  width: 100%; padding: 0.8rem 0.9rem; border-radius: 0.8rem;
  background: var(--superficie); border: 1px solid var(--borde);
  color: var(--texto); font: inherit; font-size: 1rem;
}
.error { min-height: 1.2em; margin: 0.5rem 0 0.8rem; color: var(--peligro); font-size: 0.85rem; }
.acciones { display: flex; gap: 0.6rem; align-items: center; }

/* ===== Hoja de selección ===== */
.sheet {
  position: fixed; inset: 0; z-index: 20;
  display: none; align-items: flex-end; justify-content: center;
  background: rgb(5 8 12 / 0.65);
}
.sheet.abierto { display: flex; }
.sheet-card {
  width: 100%; max-width: 30rem;
  background: #171e2b;
  border-radius: 1.25rem 1.25rem 0 0;
  padding: 1.1rem 1rem calc(1rem + env(safe-area-inset-bottom, 0px));
  border: 1px solid var(--borde); border-bottom: 0;
  max-height: 88dvh; overflow-y: auto;
}
.sheet-card h2 { margin: 0 0 0.9rem; font-size: 1.4rem; font-weight: 700; }
.grid-dias { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
.grid-sesiones { display: grid; grid-template-columns: 1fr; gap: 0.5rem; }
.op-dia {
  display: flex; flex-direction: column; align-items: center; gap: 0.1rem;
  padding: 0.7rem 0.2rem; border-radius: 0.8rem;
  background: var(--superficie); border: 1px solid transparent;
}
.op-dia span { font-size: 0.8rem; color: var(--suave); }
.op-dia b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.op-dia small { font-size: 0.65rem; color: var(--suave); line-height: 1.1; }
.op-dia.ocupado { opacity: 0.45; cursor: not-allowed; }
.op-dia.hoy { border-color: rgb(92 200 242 / 0.65); }
.op-dia.hoy span { color: #5cc8f2; }
.op-sesion { justify-content: flex-start; border-radius: 0.8rem; padding: 0.7rem 0.8rem; text-align: left; }
.op-sesion small { color: var(--suave); font-size: 0.8rem; font-family: var(--fuente-texto); font-weight: 400; }
.cancelar { display: block; width: 100%; margin-top: 0.9rem; padding: 0.7rem; border-radius: 0.8rem; background: transparent; border: 0; color: var(--suave); }
html.fondo .sheet { position: absolute; align-items: center; }
html.fondo .sheet-card { border-radius: 1rem; margin: 1rem; width: auto; border-bottom: 1px solid var(--borde); padding-bottom: 1rem; }

/* ===== Aviso con deshacer ===== */
.toast {
  position: fixed; left: 50%; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); z-index: 30;
  transform: translate(-50%, 1rem); opacity: 0; pointer-events: none;
  display: flex; align-items: center; gap: 0.9rem;
  max-width: calc(100% - 2rem);
  padding: 0.7rem 0.9rem 0.7rem 1rem; border-radius: 0.9rem;
  background: #263044; border: 1px solid var(--borde);
  font-size: 0.9rem; box-shadow: 0 8px 24px rgb(0 0 0 / 0.35);
  transition: opacity 0.2s, transform 0.2s;
}
.toast.visible { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { background: none; border: 0; padding: 0.2rem 0.3rem; color: #5cc8f2; font-weight: 650; }
html.fondo .toast { position: absolute; bottom: 1rem; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="panel" id="panel">
  <div class="contenido">

    <!-- Pantalla para ingresar el código -->
    <section id="vistaCodigo" hidden>
      <h1>Tu código personal</h1>
      <p class="ayuda">Escribilo igual en el celular y en la compu: el mismo código muestra la misma semana. Elegí uno largo y difícil de adivinar.</p>
      <form id="formCodigo" novalidate>
        <input id="inputCodigo" type="text" placeholder="ej. bruno-fuerte-2026" maxlength="64"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Código personal">
        <p class="error" id="errorCodigo" role="alert"></p>
        <div class="acciones">
          <button type="submit" class="btn-principal">Guardar código</button>
          <button type="button" class="btn-sec" id="cancelarCodigo" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <!-- Tracker -->
    <section id="vistaApp" hidden>
      <header>
        <div class="encabezado">
          <div>
            <h1>Esta semana</h1>
            <p class="rango" id="rango"></p>
          </div>
          <div class="contador" aria-live="polite"><span id="hechas">0</span><small>/7</small></div>
        </div>
        <div class="segmentos" id="segmentos" role="progressbar" aria-label="Sesiones completadas" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0"></div>
      </header>

      <div class="seccion-titulo">Te falta <span id="cuentaFaltan"></span></div>
      <div id="faltan"></div>

      <div class="seccion-titulo">Días</div>
      <div class="dias" id="dias"></div>

      <div class="pie">
        <button type="button" class="btn-sec" id="btnReset">Reiniciar semana</button>
        <button type="button" class="link" id="btnCambiarCodigo">Cambiar código</button>
        <span class="estado" id="estado" data-e="local"><i></i><b id="estadoTexto" style="font-weight:500"></b></span>
      </div>
      <p class="aviso-error" id="avisoError" hidden></p>
    </section>

  </div>

  <!-- Hoja para elegir día o sesión -->
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitulo">
    <div class="sheet-card">
      <h2 id="sheetTitulo"></h2>
      <div id="sheetOpciones"></div>
      <button type="button" class="cancelar" id="sheetCancelar">Cancelar</button>
    </div>
  </div>

  <!-- Aviso con deshacer -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastTexto"></span>
    <button type="button" id="toastDeshacer">Deshacer</button>
  </div>
</main>

<!-- Columna izquierda (fondo) / sección Fechas (celular) -->
<aside class="lateral izq" id="lateralIzq" aria-label="Fechas importantes" hidden>
  <div class="seccion-titulo">Fechas importantes</div>
  <div class="fechas" id="fechasLista"></div>
</aside>

<!-- Columna derecha (fondo) / sección Notas (celular) -->
<aside class="lateral der" id="lateralDer" aria-label="Notas" hidden>
  <div class="seccion-titulo">Notas</div>
  <div class="notas" id="notasLista"></div>
</aside>

<script type="module">

/* =====================================================================
   FECHAS IMPORTANTES (columna izquierda del fondo)
   Completá "nombre" y "fecha" con formato AAAA-MM-DD (hora opcional:

const FECHAS = [
  { nombre: "Fecha 1", fecha: "", rgb: "92 200 242" },

];

// Notitas (columna derecha): una por color. Agregá o quitá colores para cambiar la cantidad.
const COLORES_NOTAS = ["245 208 120", "120 220 190", "240 150 170", "160 190 250", "200 160 245"];
const IDS_NOTAS = COLORES_NOTAS.map((_, i) => "n" + (i + 1));
const LS_NOTAS = "tracker_notas_";

const ICONO_CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>';
const ICONO_X = '<svg class="quitar" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
const ICONO_MAS = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>';

const $ = (s) => document.querySelector(s);
const sesionPorId = (id) => SESIONES.find((s) => s.id === id);

/* ---------- Almacenamiento local (con protección por si falla) ---------- */
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

/* ---------- Fechas ---------- */
function claveSemana(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate() - d.getDay()); // domingo
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
}
function fechasSemana(clave) {
  const [y, m, d] = clave.split("-").map(Number);
  return Array.from({ length: 7 }, (_, i) => new Date(y, m - 1, d + i));
}

/* ---------- Firebase ---------- */
const firebaseListo = !Object.values(FIREBASE_CONFIG).some((v) => !v || String(v).includes("PEGAR"));
let db = null;
if (firebaseListo) {
  try {
    const app = initializeApp(FIREBASE_CONFIG);
    try {
      db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }, ID_BASE_DE_DATOS);
    } catch {
      db = getFirestore(app, ID_BASE_DE_DATOS);
    }
  } catch (e) {
    console.error("No se pudo iniciar Firebase:", e);
  }
}

/* ---------- Estado ---------- */
const params = new URLSearchParams(location.search);
let codigo = null;
let semanas = {};                       // { "2026-10-04": { pierna: 2, ... } }
let semanaKey = claveSemana(new Date());
let hoyStr = new Date().toDateString();
let desuscribir = null;
let ctxSheet = null;                    // { tipo: "dia", sid } | { tipo: "sesion", dia }

function normalizarCodigo(texto) {
  const limpio = String(texto || "").trim().toLowerCase().replace(/\s+/g, "");
  if (!/^[a-z0-9_-]*$/.test(limpio)) return { ok: false, error: "Usá solo letras, números, guion (-) y guion bajo (_)." };
  if (limpio.length < 8) return { ok: false, error: "El código necesita al menos 8 caracteres." };
  return { ok: true, valor: limpio };
}

function asignadoActual() {
  const raw = semanas[semanaKey] || {};
  const out = {};
  const usados = new Set();                       // un solo cuadradito por día
  for (const s of SESIONES) {
    const d = raw[s.id];
    if (Number.isInteger(d) && d >= 0 && d <= 6 && !usados.has(d)) { out[s.id] = d; usados.add(d); }
  }
  return out;
}

let notas = {};                          // { n1: "texto", ... }
const pendientesNotas = new Set();       // notas con cambios locales todavía no enviados
const timersNotas = {};

function guardarCache() { if (codigo) ls.set(LS_CACHE + codigo, JSON.stringify(semanas)); }
function guardarCacheNotas() { if (codigo) ls.set(LS_NOTAS + codigo, JSON.stringify(notas)); }
function cargarCache() {
  try { semanas = JSON.parse(ls.get(LS_CACHE + codigo) || "{}") || {}; } catch { semanas = {}; }
  try { notas = JSON.parse(ls.get(LS_NOTAS + codigo) || "{}") || {}; } catch { notas = {}; }
  pendientesNotas.clear();
}

/* ---------- Estado de sincronización ---------- */
const TEXTOS_ESTADO = {
  local: "Solo en este dispositivo",
  ok: "Sincronizado",
  pendiente: "Guardando…",
  conectando: "Conectando…",
  offline: "Sin conexión",
  error: "Error al sincronizar"
};
let estadoActual = "local";
const AYUDAS_ERROR = {
  "permission-denied": "Firebase rechazó el acceso. Revisá que las reglas de Firestore estén publicadas (permitiendo los campos semanas y notas) y que tu código tenga 8 o más caracteres.",
  "not-found": "No se encontró la base de datos. Revisá que esté creada y que su ID sea el mismo que ID_BASE_DE_DATOS en el archivo.",
  "unavailable": "No se pudo conectar con Firebase. Revisá tu internet o si algún bloqueador de anuncios lo está frenando.",
  "failed-precondition": "Firestore no pudo iniciar en este navegador. Probá recargar con Ctrl + Shift + R."
};
function setEstado(e, detalle) {
  estadoActual = e;
  $("#estado").dataset.e = e;
  let texto = (e === "local" && !firebaseListo) ? "Firebase sin configurar" : TEXTOS_ESTADO[e];
  if (e === "error" && detalle) texto += ` (${detalle})`;
  $("#estadoTexto").textContent = texto;
  const aviso = $("#avisoError");
  if (e === "error") {
    aviso.textContent = AYUDAS_ERROR[detalle] || `Código del error: ${detalle || "desconocido"}. Pasáselo a Claude para resolverlo.`;
    aviso.hidden = false;
  } else {
    aviso.hidden = true;
  }
}
function falloSync(err) {
  console.error(err);
  const codigoError = err && err.code ? String(err.code).replace("firestore/", "") : "desconocido";
  setEstado("error", codigoError);
}

/* ---------- Escritura ---------- */
function escribir(wk, cambios) {
  const sem = { ...(semanas[wk] || {}) };
  for (const [k, v] of Object.entries(cambios)) {
    if (v === null) delete sem[k]; else sem[k] = v;
  }
  semanas[wk] = sem;
  guardarCache();
  render();
  if (!db || !codigo) return;
  const obj = {};
  for (const [k, v] of Object.entries(cambios)) obj[k] = v === null ? deleteField() : v;
  setDoc(doc(db, COLECCION, codigo), { semanas: { [wk]: obj } }, { merge: true })
    .catch(falloSync);
}

let reintento = null;
function suscribir() {
  clearTimeout(reintento);
  if (desuscribir) { desuscribir(); desuscribir = null; }
  if (!db || !codigo) { setEstado("local"); return; }
  setEstado(navigator.onLine ? "conectando" : "offline");
  const ref = doc(db, COLECCION, codigo);
  desuscribir = onSnapshot(ref, { includeMetadataChanges: true }, (snap) => {
    if (!snap.exists()) {
      if (snap.metadata.fromCache) return;                // todavía no sabemos: no pisar lo local
      if (Object.keys(semanas).length) {                  // el servidor no tiene nada: subir lo local
        const subir = { semanas };
        if (IDS_NOTAS.some((id) => notas[id])) subir.notas = notas;
        setDoc(ref, subir, { merge: true }).catch(falloSync);
      }
      setEstado("ok");
      return;
    }
    const datos = snap.data();
    semanas = datos.semanas || {};
    const remotas = datos.notas || {};
    IDS_NOTAS.forEach((id) => {
      if (!pendientesNotas.has(id)) notas[id] = typeof remotas[id] === "string" ? remotas[id] : "";
    });
    guardarCache();
    guardarCacheNotas();
    render();
    pintarNotas();
    if (snap.metadata.hasPendingWrites) setEstado("pendiente");
    else if (snap.metadata.fromCache) setEstado(navigator.onLine ? "conectando" : "offline");
    else setEstado("ok");
  }, (err) => {
    desuscribir = null;
    falloSync(err);
    reintento = setTimeout(suscribir, 15000);   // reintenta solo (sirve cuando arreglás las reglas)
  });
}

/* ---------- Acciones ---------- */
function asignar(sid, dia) {
  const a = asignadoActual();
  const cambios = { [sid]: dia };
  for (const s of SESIONES) if (s.id !== sid && a[s.id] === dia) cambios[s.id] = null; // por si otro dispositivo ya la ocupó
  escribir(semanaKey, cambios);
}

function quitar(sid) {
  const wk = semanaKey;
  const dia = asignadoActual()[sid];
  if (dia === undefined) return;
  escribir(wk, { [sid]: null });
  mostrarToast(`${sesionPorId(sid).nombre} quitada del ${DIAS[dia].nombre.toLowerCase()}`, () => escribir(wk, { [sid]: dia }));
}

function reiniciar() {
  const wk = semanaKey;
  const previo = { ...asignadoActual() };
  const ids = Object.keys(previo);
  if (!ids.length) { mostrarToast("No hay nada para reiniciar"); return; }
  const cambios = {};
  ids.forEach((id) => (cambios[id] = null));
  escribir(wk, cambios);
  mostrarToast("Semana reiniciada", () => escribir(wk, previo));
}

/* ---------- Render ---------- */
function render() {
  const a = asignadoActual();
  const fechas = fechasSemana(semanaKey);
  const hoyIdx = new Date().getDay();

  // Rango
  const f0 = fechas[0], f6 = fechas[6];
  $("#rango").textContent = f0.getMonth() === f6.getMonth()
    ? `${f0.getDate()} – ${f6.getDate()} ${MESES[f6.getMonth()]}`
    : `${f0.getDate()} ${MESES[f0.getMonth()]} – ${f6.getDate()} ${MESES[f6.getMonth()]}`;

  // Contador y barra segmentada (cada sesión hecha enciende un segmento con su color)
  const hechas = SESIONES.filter((s) => a[s.id] !== undefined);
  $("#hechas").textContent = hechas.length;
  const barra = $("#segmentos");
  barra.setAttribute("aria-valuenow", hechas.length);
  barra.innerHTML = SESIONES.map((_, i) =>
    i < hechas.length ? `<i class="seg on" style="--rgb:${hechas[i].rgb}"></i>` : '<i class="seg"></i>'
  ).join("");

  // Te falta
  const faltan = SESIONES.filter((s) => a[s.id] === undefined);
  $("#cuentaFaltan").textContent = faltan.length ? `(${faltan.length})` : "";
  $("#faltan").className = faltan.length ? "faltan" : "";
  $("#faltan").innerHTML = faltan.length
    ? faltan.map((x) => `<button type="button" class="tarjeta" style="--rgb:${x.rgb}" data-accion="faltante" data-sid="${x.id}"><span class="t-nombre">${x.nombre}</span><span class="t-sub">${x.sub}</span></button>`).join("")
    : '<p class="completa">Semana completa. Todas las sesiones están marcadas.</p>';

  // Días: una tarjeta por día
  const porDia = {};
  SESIONES.forEach((x) => { if (a[x.id] !== undefined) porDia[a[x.id]] = x; });
  $("#dias").innerHTML = DIAS.map((d, i) => {
    const x = porDia[i];
    const esHoy = i === hoyIdx;
    const fecha = fechas[i];
    let tarjeta;
    if (x) {
      tarjeta = `<button type="button" class="tarjeta lleno" style="--rgb:${x.rgb}" data-accion="chip" data-sid="${x.id}" aria-label="${x.nombre} el ${d.nombre.toLowerCase()}. Tocá para quitar"><span class="t-nombre">${x.nombre}</span><span class="t-sub">${x.sub}</span></button>`;
    } else if (faltan.length) {
      tarjeta = `<button type="button" class="tarjeta vacia" data-accion="dia" data-dia="${i}" aria-label="Agregar sesión al ${d.nombre.toLowerCase()}">${ICONO_MAS}<span>Tocá para elegir</span></button>`;
    } else {
      tarjeta = '<div class="tarjeta vacia libre"><span>Libre</span></div>';
    }
    return `<div class="dia${esHoy ? " hoy" : ""}"${esHoy ? ' aria-current="date"' : ""}>
      <div class="dia-cab"><div class="dia-nombre">${d.abr}</div><div class="dia-fecha">${esHoy ? "Hoy" : `${fecha.getDate()} ${MESES[fecha.getMonth()]}`}</div></div>${tarjeta}</div>`;
  }).join("");
}

/* ---------- Fechas importantes ---------- */
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function objetivoFecha(txt) {
  if (!txt) return null;
  const d = new Date(txt.length === 10 ? txt + "T00:00:00" : txt);
  return isNaN(d) ? null : d;
}

function renderFechas() {
  const ahora = new Date();
  const hoy0 = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate()).getTime();
  $("#fechasLista").innerHTML = FECHAS.map((f) => {
    const obj = objetivoFecha(f.fecha);
    let num = "—", resto = "Sin fecha", clase = " vacia";
    if (obj) {
      const diff = obj - ahora;
      const objDia = new Date(obj.getFullYear(), obj.getMonth(), obj.getDate()).getTime();
      if (diff > 0) {
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        num = String(d);
        resto = `${d === 1 ? "día" : "días"} · ${String(h).padStart(2, "0")} h ${String(m).padStart(2, "0")} m`;
        clase = "";
      } else if (objDia === hoy0) {
        num = "Hoy"; resto = "¡es el día!"; clase = "";
      } else {
        resto = "Ya pasó";
      }
    }
    return `<div class="cuenta${clase}" style="--rgb:${f.rgb}"><div class="cuenta-num">${num}</div><div class="cuenta-info"><span class="cuenta-nombre">${esc(f.nombre)}</span><span class="cuenta-resto">${resto}</span></div></div>`;
  }).join("");
}

/* ---------- Notitas ---------- */
function construirNotas() {
  $("#notasLista").innerHTML = IDS_NOTAS.map((id, i) =>
    `<div class="nota" style="--rgb:${COLORES_NOTAS[i]}"><textarea data-nota="${id}" rows="3" maxlength="600" placeholder="Nota…" aria-label="Nota ${i + 1}"></textarea></div>`
  ).join("");
  pintarNotas();
}
function pintarNotas() {
  document.querySelectorAll("#notasLista textarea").forEach((t) => {
    if (document.activeElement === t) return;           // no pisar lo que estás escribiendo
    const v = notas[t.dataset.nota] || "";
    if (t.value !== v) t.value = v;
  });
}
function enviarNota(id) {
  pendientesNotas.delete(id);
  if (!db || !codigo) return;
  setDoc(doc(db, COLECCION, codigo), { notas: { [id]: notas[id] || "" } }, { merge: true }).catch(falloSync);
}
function enviarNotasPendientes() { [...pendientesNotas].forEach((id) => { clearTimeout(timersNotas[id]); enviarNota(id); }); }

/* ---------- Hoja de selección ---------- */
function abrirSheetDia(sid) {
  const s = sesionPorId(sid);
  const fechas = fechasSemana(semanaKey);
  const hoyIdx = new Date().getDay();
  ctxSheet = { tipo: "dia", sid };
  $("#sheetTitulo").textContent = `¿Qué día fue ${s.nombre}?`;
  $("#sheetOpciones").className = "grid-dias";
  const a = asignadoActual();
  const ocupados = {};
  SESIONES.forEach((x) => { if (a[x.id] !== undefined) ocupados[a[x.id]] = x; });
  $("#sheetOpciones").innerHTML = DIAS.map((d, i) => ocupados[i]
    ? `<button type="button" class="op-dia ocupado" disabled><span>${d.abr}</span><b>${fechas[i].getDate()}</b><small>${ocupados[i].nombre}</small></button>`
    : `<button type="button" class="op-dia${i === hoyIdx ? " hoy" : ""}" data-accion="elegir-dia" data-dia="${i}"><span>${d.abr}</span><b>${fechas[i].getDate()}</b></button>`
  ).join("");
  abrirSheet();
}

function abrirSheetSesion(dia) {
  const a = asignadoActual();
  const faltan = SESIONES.filter((s) => a[s.id] === undefined);
  if (!faltan.length) return;
  ctxSheet = { tipo: "sesion", dia };
  $("#sheetTitulo").textContent = `¿Qué hiciste el ${DIAS[dia].nombre.toLowerCase()}?`;
  $("#sheetOpciones").className = "grid-sesiones";
  $("#sheetOpciones").innerHTML = faltan.map((x) =>
    `<button type="button" class="tarjeta" style="--rgb:${x.rgb}" data-accion="elegir-sesion" data-sid="${x.id}"><span class="t-nombre">${x.nombre}</span><span class="t-sub">${x.sub}</span></button>`
  ).join("");
  abrirSheet();
}

function abrirSheet() {
  $("#sheet").classList.add("abierto");
  const primero = $("#sheetOpciones button:not([disabled])");
  if (primero) primero.focus({ preventScroll: true });
}
function cerrarSheet() { $("#sheet").classList.remove("abierto"); ctxSheet = null; }

/* ---------- Aviso con deshacer ---------- */
let toastTimer = null, toastUndo = null;
function mostrarToast(texto, undo) {
  clearTimeout(toastTimer);
  $("#toastTexto").textContent = texto;
  toastUndo = undo || null;
  $("#toastDeshacer").hidden = !undo;
  $("#toast").classList.add("visible");
  toastTimer = setTimeout(ocultarToast, 6000);
}
function ocultarToast() { $("#toast").classList.remove("visible"); toastUndo = null; }

/* ---------- Pantallas ---------- */
function mostrarPantallaCodigo(permitirCancelar) {
  $("#vistaApp").hidden = true;
  $("#lateralIzq").hidden = true;
  $("#lateralDer").hidden = true;
  $("#vistaCodigo").hidden = false;
  $("#cancelarCodigo").hidden = !permitirCancelar;
  $("#errorCodigo").textContent = "";
  $("#inputCodigo").value = permitirCancelar && codigo ? codigo : "";
  setTimeout(() => $("#inputCodigo").focus({ preventScroll: true }), 50);
}
function mostrarApp() {
  $("#vistaCodigo").hidden = true;
  $("#vistaApp").hidden = false;
  $("#lateralIzq").hidden = false;
  $("#lateralDer").hidden = false;
  render();
  renderFechas();
  construirNotas();
}

/* ---------- Eventos ---------- */
document.addEventListener("click", (e) => {
  if (e.target === $("#sheet")) { cerrarSheet(); return; }
  const el = e.target.closest("[data-accion]");
  if (!el) return;
  const { accion, sid } = el.dataset;
  const dia = el.dataset.dia !== undefined ? Number(el.dataset.dia) : undefined;
  if (accion === "faltante") abrirSheetDia(sid);
  else if (accion === "dia") abrirSheetSesion(dia);
  else if (accion === "chip") quitar(sid);
  else if (accion === "elegir-dia" && ctxSheet) { const s = ctxSheet.sid; cerrarSheet(); asignar(s, dia); }
  else if (accion === "elegir-sesion" && ctxSheet) { const d = ctxSheet.dia; cerrarSheet(); asignar(sid, d); }
});

$("#sheetCancelar").addEventListener("click", cerrarSheet);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarSheet(); });

$("#toastDeshacer").addEventListener("click", () => {
  const fn = toastUndo;
  ocultarToast();
  if (fn) fn();
});

// Reiniciar: confirmación en dos toques
let resetArmado = false, resetTimer = null;
function desarmarReset() {
  resetArmado = false;
  clearTimeout(resetTimer);
  const b = $("#btnReset");
  b.textContent = "Reiniciar semana";
  b.classList.remove("peligro");
}
$("#btnReset").addEventListener("click", () => {
  if (!resetArmado) {
    resetArmado = true;
    $("#btnReset").textContent = "Tocá de nuevo para confirmar";
    $("#btnReset").classList.add("peligro");
    resetTimer = setTimeout(desarmarReset, 3500);
  } else {
    desarmarReset();
    reiniciar();
  }
});

$("#btnCambiarCodigo").addEventListener("click", () => mostrarPantallaCodigo(true));
$("#cancelarCodigo").addEventListener("click", mostrarApp);
$("#formCodigo").addEventListener("submit", (e) => {
  e.preventDefault();
  const r = normalizarCodigo($("#inputCodigo").value);
  if (!r.ok) { $("#errorCodigo").textContent = r.error; return; }
  codigo = r.valor;
  ls.set(LS_CODIGO, codigo);
  cargarCache();
  mostrarApp();
  suscribir();
});

// Notitas: guardan solas al escribir y al salir del cuadro
$("#notasLista").addEventListener("input", (e) => {
  const t = e.target.closest("textarea[data-nota]");
  if (!t) return;
  const id = t.dataset.nota;
  notas[id] = t.value;
  pendientesNotas.add(id);
  guardarCacheNotas();
  clearTimeout(timersNotas[id]);
  timersNotas[id] = setTimeout(() => enviarNota(id), 700);
});
$("#notasLista").addEventListener("focusout", (e) => {
  const t = e.target.closest("textarea[data-nota]");
  if (!t) return;
  clearTimeout(timersNotas[t.dataset.nota]);
  if (pendientesNotas.has(t.dataset.nota)) enviarNota(t.dataset.nota);
});

// Conexión
window.addEventListener("offline", () => { if (db && codigo) setEstado("offline"); });
window.addEventListener("online", () => { if (db && codigo && estadoActual === "offline") setEstado("conectando"); });

// Cambio de día / semana (importante para el fondo, que queda abierto días)
function revisarFecha() {
  const k = claveSemana(new Date());
  const h = new Date().toDateString();
  if (k !== semanaKey || h !== hoyStr) {
    semanaKey = k;
    hoyStr = h;
    if (!$("#vistaApp").hidden) render();
  }
  if (!$("#lateralIzq").hidden) renderFechas();     // actualiza los contadores
}
setInterval(revisarFecha, 30000);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) enviarNotasPendientes(); else revisarFecha();
});

/* ---------- Inicio ---------- */
(function iniciar() {
  // Atajo: ?codigo=mi-codigo-largo guarda el código (útil en Lively, que tiene su propio almacenamiento)
  const deURL = params.get("codigo");
  if (deURL) {
    const r = normalizarCodigo(deURL);
    if (r.ok) ls.set(LS_CODIGO, r.valor);
  }
  const guardado = ls.get(LS_CODIGO);
  const r = guardado ? normalizarCodigo(guardado) : { ok: false };
  if (r.ok) {
    codigo = r.valor;
    cargarCache();
    mostrarApp();
    suscribir();
  } else {
    setEstado("local");
    mostrarPantallaCodigo(false);
  }
})();
</script>
